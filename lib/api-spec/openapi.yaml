openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: OmniNova AI Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: memories
    description: Memory management
  - name: notes
    description: Notes and reminders
  - name: settings
    description: User settings and AI personality
  - name: routines
    description: Assistant routines and automations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: Streaming text/event-stream response

  /openai/conversations/{id}/voice-messages:
    post:
      operationId: sendOpenaiVoiceMessage
      tags: [openai]
      summary: Send audio and receive a streaming voice response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiVoiceMessageInput"
      responses:
        "200":
          description: Streaming voice response

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List all memories
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes and reminders
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note or reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings and AI personality config
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [settings]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /routines:
    get:
      operationId: listRoutines
      tags: [routines]
      summary: List all routines
      responses:
        "200":
          description: List of routines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Routine"
    post:
      operationId: createRoutine
      tags: [routines]
      summary: Create a routine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineInput"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"

  /routines/{id}:
    delete:
      operationId: deleteRoutine
      tags: [routines]
      summary: Delete a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /routines/{id}/run:
    post:
      operationId: runRoutine
      tags: [routines]
      summary: Run a routine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Routine result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineRunResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiVoiceMessageInput:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
      required:
        - audio

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Memory:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - category
        - createdAt

    MemoryInput:
      type: object
      properties:
        content:
          type: string
        category:
          type: string
      required:
        - content
        - category

    Note:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [note, reminder]
        completed:
          type: boolean
        reminderAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - type
        - completed
        - createdAt

    NoteInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [note, reminder]
        reminderAt:
          type: string
          format: date-time
      required:
        - title
        - type

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        completed:
          type: boolean
        reminderAt:
          type: ["string", "null"]
          format: date-time

    UserSettings:
      type: object
      properties:
        id:
          type: integer
        assistantName:
          type: string
        personality:
          type: string
          enum: [omni, jarvis, friday, friday_v2, custom]
        customPersonality:
          type: ["string", "null"]
        voiceEnabled:
          type: boolean
        voiceGender:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        theme:
          type: string
          enum: [violet, blue, gold, red, green]
        wakeWord:
          type: string
        wakeWordEnabled:
          type: boolean
        greetingStyle:
          type: string
          enum: [friendly, professional, casual, energetic]
        userName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - assistantName
        - personality
        - voiceEnabled
        - voiceGender
        - theme
        - wakeWord
        - wakeWordEnabled
        - greetingStyle
        - userName
        - createdAt

    UserSettingsUpdate:
      type: object
      properties:
        assistantName:
          type: string
        personality:
          type: string
          enum: [omni, jarvis, friday, friday_v2, custom]
        customPersonality:
          type: ["string", "null"]
        voiceEnabled:
          type: boolean
        voiceGender:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]
        theme:
          type: string
          enum: [violet, blue, gold, red, green]
        wakeWord:
          type: string
        wakeWordEnabled:
          type: boolean
        greetingStyle:
          type: string
          enum: [friendly, professional, casual, energetic]
        userName:
          type: string

    DashboardStats:
      type: object
      properties:
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        totalMemories:
          type: integer
        totalNotes:
          type: integer
        activeReminders:
          type: integer
      required:
        - totalConversations
        - totalMessages
        - totalMemories
        - totalNotes
        - activeReminders

    Routine:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        trigger:
          type: string
        icon:
          type: string
        actions:
          type: string
          description: JSON array of actions
        active:
          type: boolean
        lastRun:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - trigger
        - icon
        - actions
        - active
        - createdAt

    RoutineInput:
      type: object
      properties:
        name:
          type: string
        trigger:
          type: string
        icon:
          type: string
        actions:
          type: string
          description: JSON array of actions
      required:
        - name
        - trigger
        - icon
        - actions

    RoutineRunResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        actionsExecuted:
          type: integer
      required:
        - success
        - message
        - actionsExecuted
